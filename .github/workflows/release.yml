name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: iler-core
            context: core
          - name: iler-web
            context: web
          - name: iler-updater
            context: updater
    steps:
      - uses: actions/checkout@v4
      - name: Version and owner
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >>"$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # explicit version tags only: the updater channel decides what "stable" is
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/${{ matrix.name }}:${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  bundle:
    runs-on: ubuntu-latest
    needs: images
    steps:
      - uses: actions/checkout@v4
      - name: Version and owner
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >>"$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >>"$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build bundles
        env:
          ILER_IMAGE_OWNER: ${{ steps.meta.outputs.owner }}
        run: bash scripts/build-offline-bundle.sh "${{ steps.meta.outputs.version }}"
      - name: Stage installer
        run: cp deploy/install.sh dist/install.sh
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/iler-bot.tar.gz
            dist/iler-bot-${{ steps.meta.outputs.version }}-offline.tar.gz
            dist/stable.env
            dist/install.sh
            dist/SHA256SUMS
          fail_on_unmatched_files: true

  windows-setup:
    runs-on: windows-latest
    needs: bundle
    steps:
      - uses: actions/checkout@v4
      - name: Channel file for this version
        shell: pwsh
        run: |
          $v = "$env:GITHUB_REF_NAME".TrimStart('v')
          Set-Content -Path deploy/channel/stable.env -Value "ILER_VERSION=$v" -Encoding ascii
          (Get-Content deploy/.env.example) -replace '^ILER_VERSION=.*', "ILER_VERSION=$v" |
            Set-Content deploy/.env.example -Encoding ascii
          "ILER_APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build ILER-Setup.exe (online installer, no images.tar)
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=$env:ILER_APP_VERSION" deploy\windows\ILER-Setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ILER-Setup-*.exe
          fail_on_unmatched_files: true
