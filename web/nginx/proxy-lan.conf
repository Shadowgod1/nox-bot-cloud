# LAN mode (default): browsers connect to nginx directly. Included by nginx.conf via
# /tmp/iler-proxy-mode.conf (chosen by iler-web-entrypoint.sh). The client address is the TCP peer;
# headers such as CF-Connecting-IP or X-Forwarded-Proto from the browser are ignored.
map $scheme $iler_forwarded_proto {
  default $scheme;
}
