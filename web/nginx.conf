# iler-web: serves the admin SPA and proxies the API to iler-core.
# Runs as the unprivileged `nginx` user: no `user` directive, pid and temp files in /tmp, port 8080.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  # No client IPs or query strings beyond the request line; API bodies are never logged.
  log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent $request_time';
  access_log /dev/stdout main;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 10m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Docker's embedded DNS. A variable upstream makes nginx resolve at request time,
  # so iler-web starts even while iler-core is down and follows container restarts.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    set $iler_core http://iler-core:8000;

    # Security headers (inherited by every location below that has no add_header of its own).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # The Evolution webhook lives on iler-core only and is never reachable through the proxy.
    location /internal/ {
      return 404;
    }

    location = /health {
      proxy_pass $iler_core;
      proxy_set_header Host $host;
      access_log off;
    }

    # Server-Sent Events: no buffering, long-lived connection.
    location = /api/events {
      proxy_pass $iler_core;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }

    location /api/ {
      proxy_pass $iler_core;
      proxy_http_version 1.1;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      # Backups and LLM checks can take a while.
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      # Backup downloads stream straight to the browser.
      proxy_max_temp_file_size 0;
      # iler-core down or restarting (e.g. during an update): answer in the API error format.
      error_page 502 503 504 = @core_unavailable;
    }

    location @core_unavailable {
      default_type application/json;
      charset utf-8;
      charset_types application/json;
      return 503 '{"error":{"code":"core_unavailable","message":"Сервер ILER перезапускается или недоступен. Повторите через минуту."}}';
    }

    # Fingerprinted build assets: cache for a long time.
    location /assets/ {
      try_files $uri =404;
      expires 1y;
      access_log off;
    }

    # SPA: unknown paths fall back to index.html, which is never cached.
    location / {
      try_files $uri $uri/ /index.html;
      expires -1;
    }
  }
}
