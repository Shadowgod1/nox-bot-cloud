# nox-portal web: serves the SPA and proxies /api to the portal api. Runs as the unprivileged nginx user.
# Published on 127.0.0.1:8100 only; cloudflared on the host routes bot.noxsw.kz here.
# The provisioner's internal API is a separate port of the api container and is never proxied.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  # Visitor IP from the tunnel: CF-Connecting-IP is trusted only when the TCP peer is loopback or a
  # docker network (cloudflared on the host reaches us via docker-proxy / the bridge gateway).
  set_real_ip_from 127.0.0.1;
  set_real_ip_from ::1;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header CF-Connecting-IP;
  real_ip_recursive off;

  # $uri only: query strings never reach the logs; bodies are never logged.
  log_format main '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';
  access_log /dev/stdout main;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 64k;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  # Coarse flood guard in front of the per-IP / per-e-mail limits of the api.
  limit_req_zone $binary_remote_addr zone=nox_auth:1m rate=30r/m;
  # Online payment provider callbacks (signature-checked and rate-limited again by the api)
  limit_req_zone $binary_remote_addr zone=nox_payhook:1m rate=120r/m;
  limit_req_status 429;

  server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    set $nox_api http://api:8000;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location /internal/ {
      return 404;
    }

    # LLM gateway for the bots: long streamed answers (SSE) pass through unbuffered, bodies up to 10 MiB
    # (= NOX_GATEWAY_MAX_BODY_BYTES). Keys travel in headers only; the access log has no query strings.
    location /llm/ {
      client_max_body_size 10m;
      proxy_pass $nox_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      gzip off;
      proxy_connect_timeout 5s;
      proxy_read_timeout 900s;
      proxy_send_timeout 900s;
      error_page 502 503 504 = @llm_unavailable;
    }

    location @llm_unavailable {
      default_type application/json;
      charset utf-8;
      charset_types application/json;
      return 503 '{"error":{"type":"gateway_unavailable","message":"Шлюз Nox временно недоступен"}}';
    }

    location = /health {
      proxy_pass $nox_api;
      access_log off;
    }

    location ~ ^/api/(auth|staff/auth)/ {
      limit_req zone=nox_auth burst=20 nodelay;
      error_page 429 = @rate_limited;
      proxy_pass $nox_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      error_page 502 503 504 = @api_unavailable;
    }

    # public provider callbacks: no session; the api verifies the signature (webhooks) or the Kaspi allowlist / auth
    location ~ ^/api/payments/(webhook/|kaspi$) {
      limit_req zone=nox_payhook burst=60 nodelay;
      error_page 429 = @rate_limited;
      proxy_pass $nox_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      error_page 502 503 504 = @api_unavailable;
    }

    location /api/ {
      proxy_pass $nox_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      error_page 502 503 504 = @api_unavailable;
    }

    location @rate_limited {
      default_type application/json;
      charset utf-8;
      charset_types application/json;
      add_header Retry-After 60 always;
      return 429 '{"error":{"code":"rate_limited","message":"Слишком много попыток. Повторите через минуту."}}';
    }

    location @api_unavailable {
      default_type application/json;
      charset utf-8;
      charset_types application/json;
      return 503 '{"error":{"code":"api_unavailable","message":"Сервис временно недоступен. Повторите через минуту."}}';
    }

    location /assets/ {
      try_files $uri =404;
      expires 1y;
      access_log off;
    }

    location / {
      try_files $uri $uri/ /index.html;
      expires -1;
    }
  }
}
