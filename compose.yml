# ILER Bot — production stack (spec section 4).
# Values come from .env next to this file (generated by deploy/install.sh from deploy/.env.example).
# Only iler-web publishes a port. Networks:
#   iler         web, core, postgres, redis, evolution-api
#   updater_net  core and iler-updater only (Evolution, postgres and redis cannot reach the updater,
#                which holds docker.sock)
# Image digests: ILER_*_DIGEST (optional, from the release channel) pin our images to tag@digest.
name: iler

x-common: &common
  restart: unless-stopped
  networks: [iler]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  iler-web:
    <<: *common
    image: ghcr.io/${ILER_IMAGE_OWNER:-shadowgod1}/iler-web:${ILER_VERSION:-dev}${ILER_WEB_DIGEST:+@${ILER_WEB_DIGEST}}
    build:
      context: ./web
    ports:
      - "${ILER_HTTP_PORT:-8080}:8080"
    depends_on:
      iler-core:
        condition: service_started
    mem_limit: 128m
    healthcheck:
      # static check only: the SPA must load even while core restarts
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  iler-core:
    <<: *common
    image: ghcr.io/${ILER_IMAGE_OWNER:-shadowgod1}/iler-core:${ILER_VERSION:-dev}${ILER_CORE_DIGEST:+@${ILER_CORE_DIGEST}}
    build:
      context: ./core
    networks: [iler, updater_net]
    environment:
      ILER_DATABASE_URL: postgresql://iler:${ILER_DB_PASSWORD}@postgres:5432/iler
      ILER_SECRET_KEY: ${ILER_SECRET_KEY}
      ILER_EVO_URL: http://evolution-api:8080
      ILER_EVO_API_KEY: ${ILER_EVO_API_KEY}
      ILER_WEBHOOK_URL: http://iler-core:8000/internal/evolution/webhook
      ILER_UPDATER_URL: http://iler-updater:9000
      ILER_UPDATER_TOKEN: ${ILER_UPDATER_TOKEN}
      # one-time token for the first-run wizard (printed by install.sh as the setup link)
      ILER_SETUP_TOKEN: ${ILER_SETUP_TOKEN}
      ILER_REDIS_PASSWORD: ${ILER_REDIS_PASSWORD}
      ILER_TZ: ${ILER_TZ:-Asia/Almaty}
      ILER_DATA_DIR: /data
    volumes:
      # backups run inside core (scheduler worker); host path is /opt/iler/backups by default
      - ${ILER_DIR:-/opt/iler}/backups:/data/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    <<: *common
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    environment:
      POSTGRES_USER: iler
      POSTGRES_PASSWORD: ${ILER_DB_PASSWORD}
      POSTGRES_DB: iler
      # consumed by deploy/postgres-init/10-evolution-db.sh on first start
      ILER_EVO_DB_PASSWORD: ${ILER_EVO_DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iler -d iler"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    <<: *common
    image: redis:7-alpine@sha256:7b1753b4c5ad8458906c272a8132b8c15f5557b000379eb115fb239706a384b7
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction",
              "--requirepass", "${ILER_REDIS_PASSWORD}"]
    environment:
      # used by redis-cli in the healthcheck (keeps the password out of the command line)
      REDISCLI_AUTH: ${ILER_REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  evolution-api:
    <<: *common
    # v2.3.7 pinned by digest — never "latest" (spec section 11.1)
    image: evoapicloud/evolution-api:v2.3.7@sha256:1bd8afc4a6cf48822e6cf02469aeae7bd35a12a6b616eacd1291926307f4d339
    environment:
      AUTHENTICATION_API_KEY: ${ILER_EVO_API_KEY}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${ILER_EVO_DB_PASSWORD}@postgres:5432/evolution?schema=public
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:${ILER_REDIS_PASSWORD}@redis:6379/1
      CACHE_REDIS_PREFIX_KEY: evolution
      DEL_INSTANCE: "false"
      QRCODE_LIMIT: "30"
      WEBHOOK_GLOBAL_ENABLED: "false"
      LOG_BAILEYS: warn
      CONFIG_SESSION_PHONE_CLIENT: ILER
      NODE_OPTIONS: --max-old-space-size=1024
    volumes:
      - evo_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1280m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  iler-updater:
    <<: *common
    image: ghcr.io/${ILER_IMAGE_OWNER:-shadowgod1}/iler-updater:${ILER_VERSION:-dev}${ILER_UPDATER_DIGEST:+@${ILER_UPDATER_DIGEST}}
    build:
      context: ./updater
    # only core can reach the updater
    networks: [updater_net]
    environment:
      ILER_UPDATER_TOKEN: ${ILER_UPDATER_TOKEN}
      ILER_DIR: ${ILER_DIR:-/opt/iler}
      ILER_CORE_URL: http://iler-core:8000
      ILER_CHANNEL_URL: ${ILER_CHANNEL_URL:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # same path inside and outside: compose run from inside resolves host bind paths correctly
      - ${ILER_DIR:-/opt/iler}:${ILER_DIR:-/opt/iler}
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  iler:
  updater_net:

volumes:
  pg_data:
  redis_data:
  evo_instances:
